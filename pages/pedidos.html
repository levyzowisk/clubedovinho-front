<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../css/custom.css">
    </head>
    <body class="container">
        <hr>
        <nav class="text-end">
            <a href="dashboard.html" class="btn btn-outline-dark">
                Dashboard
            </a>
            <a href="categorias.html" class="btn btn-outline-dark">
                Categorias
            </a>
            <a href="clientes.html" class="btn btn-outline-dark">
                Clientes
            </a>
            <a href="paises.html" class="btn btn-outline-dark">
                Países
            </a>
            <a href="produtos.html" class="btn btn-outline-dark">
                Produtos
            </a>
            <a href="pedidos.html" class="btn btn-dark">
                Pedidos
            </a>

            <a href="../index.html" class="btn btn-outline-danger">Sair</a>
        </nav>
        <hr>

        <h2>Pedidos</h2>

        <div class="col text-end">
            <button class="btn btn-primary mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
                Novo Pedido
            </button>
        </div>

        <section class="card card-body">
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nº pedido</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Total da compra</th>
                        <th>Pedido Efetuado</th>
                        <th>Endereço de entrega</th>
                    </tr>
                </thead>

                <tbody id="table-order">
                </tbody>
            </table>


            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
                <div class="offcanvas-header">
                  <h5 class="offcanvas-title" id="offcanvasExampleLabel">Novo Pedido</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                  <form id="form" action="" onsubmit="addOrder(event)">
                    <label for="produto">Produto</label>
                    <select class="form-select mb-3" id="produto">
                        <option selected>-- Selecione --</option>
                    </select>
                    
                    
                    <label for="quantity">Quantidade</label>
                    <input onblur="calcularCompra()" id="quantity" type="number" min="0" class="form-control mb-3" placeholder="Digite o nome do produto">
                    
                    <label for="valor_compra">Valor da compra</label>
                    <p id="valor_compra">R$ </p>

                    <label for="entrega">Endereço de entrega</label>
                    <input id="entrega" type="text" min="1" step="0.01" class="form-control mb-3" placeholder="Digite o endereço de entrega">

                    <button data-bs-dismiss="offcanvas" class="btn btn-primary w-100">PRONTO</button>
                  </form>
                </div>
              </div>

        </section>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script type="module" src="../js/pedidos.js"></script>
        <script src="../js/darkmode.js"></script>

    </body>
</html>
